# Ported from ~/.config/foot/foot.ini (same font, padding, Gruvbox colours).
# Links: click opens them; inside agent CLIs (omp, Claude Code) hold Shift and click.
# Keyboard: Ctrl+Shift+E shows letter labels on every link, like foot's Ctrl+Shift+O.

font_family JetBrainsMono Nerd Font
font_size 11
window_padding_width 10
background_opacity 0.95

background #282828
foreground #ebdbb2
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# foot had Super+V as an extra paste key; Ctrl+Shift+C / Ctrl+Shift+V are kitty defaults.
map super+v paste_from_clipboard
